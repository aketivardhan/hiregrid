<!DOCTYPE html>
<html>
<head>
<title>Saved Jobs</title>

<style>
.navbar {
  background:#0a66c2;
  padding:15px;
  display:flex;
  justify-content:space-between;
}
.logo { height:40px; }
.navbar a { color:white; margin-left:15px; }
</style>

</head>

<body>

<div class="navbar">
  <img src="../images/logo.png" class="logo">
  <div>
    <a href="dashboard.html">Dashboard</a>
    <a href="jobs.html">Jobs</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>
</div>

<h2>Saved Jobs</h2>
<div id="jobs"></div>

<script>

const email = localStorage.getItem("email");

async function load(){

  const res = await fetch(`http://localhost:5000/api/jobs/saved/${email}`);
  const jobs = await res.json();

  document.getElementById("jobs").innerHTML = jobs.map(job => `
    <div>
      <h3>${job.title}</h3>
      <p>${job.company}</p>
    </div>
  `).join("");
}

function logout(){
  localStorage.clear();
  window.location.href="login.html";
}

load();

</script>

</body>
</html>
