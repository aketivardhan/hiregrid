<!DOCTYPE html>
<html>
<head>
<title>Applicants</title>

<style>

body {
  margin: 0;
  font-family: Arial;
  background: #f4f6f8;
}

.navbar {
  display: flex;
  justify-content: space-between;
  padding: 12px 20px;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(10px);
}

.nav-left {
  display: flex;
  align-items: center;
}

.logo {
  height: 40px;
}

.nav-links a {
  margin-left: 15px;
  text-decoration: none;
  color: black;
}

.container {
  width: 350px;
  margin: auto;
  margin-top: 40px;
  background: white;
  padding: 20px;
  border-radius: 10px;
}

.card {
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

</style>
</head>

<body>

<div class="navbar">

  <div class="nav-left">
    <img src="../images/logo.png" class="logo">
  </div>

  <div class="nav-links">
    <a href="dashboard.html">Dashboard</a>
    <a href="myjobs.html">My Jobs</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>

</div>

<div class="container">

<h2>Applicants</h2>

<div id="list"></div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const jobId = params.get("id");

async function loadApplicants(){

  const res = await fetch(`http://localhost:5000/api/jobs/applicants/${jobId}`);
  const data = await res.json();

  const container = document.getElementById("list");

  if (data.length === 0){
    container.innerHTML = "No applicants";
    return;
  }

  container.innerHTML = data.map(a => `
    <div class="card">
      ${a.email}
    </div>
  `).join("");
}

function logout(){
  localStorage.clear();
  window.location.href = "login.html";
}

loadApplicants();

</script>

</body>
</html>
