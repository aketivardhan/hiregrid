<!DOCTYPE html>
<html>
<head>
<title>Recruiter Register</title>

<style>

body {
  margin: 0;
  height: 100vh;
  font-family: Arial;
  background: linear-gradient(-45deg, #0a66c2, #6a11cb, #2575fc, #00c6ff);
  background-size: 400% 400%;
  animation: bg 10s ease infinite;
}

@keyframes bg {
  0% {background-position:0%}
  50% {background-position:100%}
  100% {background-position:0%}
}

.navbar {
  display: flex;
  justify-content: space-between;
  padding: 12px 20px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(12px);
}

.nav-left {
  display: flex;
  align-items: center;
}

.logo {
  height: 40px;
}

.container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 320px;
  padding: 30px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(15px);
  border-radius: 12px;
  text-align: center;
  color: white;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

button {
  margin-top: 15px;
  width: 100%;
  padding: 10px;
  background: #0a66c2;
  color: white;
  border: none;
}

a { color: white; }

</style>
</head>

<body>

<div class="navbar">
  <div class="nav-left">
    <img src="../images/logo.png" class="logo">
  </div>
  <a href="login.html">Login</a>
</div>

<div class="container">

<h2>Recruiter Register</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="registerRecruiter()">Register</button>

</div>

<script>

async function registerRecruiter(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!email || !password) return alert("All fields required");
  if (password.length < 4) return alert("Min 4 chars");

  const res = await fetch("http://localhost:5000/api/auth/register", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ email, password, role:"recruiter" })
  });

  const data = await res.json();

  if (!res.ok) return alert(data.message);

  alert("Registered");
  window.location.href = "login.html";
}

</script>

</body>
</html>
